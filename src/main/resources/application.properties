spring.application.name=tutoria1
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/tutoria01?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Driver de MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.config.import=optional:file:.env[.properties]
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# habilitar/deshabilitar api-docs - swagger-ui
springdoc.api-docs.enabled = true
springdoc.swagger-ui.enabled=true

# definir la ruta de swagger-ui
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# seleccionar paquetes, clases a escanear
springdoc.pathsToMatch=/api/documento/**, /persona/**, /api/trayectos/**, /usuario/**, /api/vehiculos/**, /api/vehiculo_documento/**, /api/vehiculo-persona/** ,/authenticate

